.deploy_base:
  tags: [trigger]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.deploy_template:
  extends: .deploy_base
  stage: deploy
  script:
    - mkdir -p $DEPLOY_PATH
    - cp compose.yml $DEPLOY_PATH/compose.yml
    - cp Dockerfile.rabbit $DEPLOY_PATH/Dockerfile.rabbit
    - cp -r rabbit_plugins $DEPLOY_PATH/rabbit_plugins
    - cp -r .gitlab/ci/scripts/* $DEPLOY_PATH/scripts
    - chmod +x $DEPLOY_PATH/scripts/*.sh
    - cd $DEPLOY_PATH

    - ./scripts/generate-env.sh

    - ./scripts/deploy.sh
  artifacts:
    paths:
      - $DEPLOY_PATH/.env
    expire_in: 1 day
    when: on_failure

.env_test:
  variables:
    ENVIRONMENT: test
    DEPLOY_PATH: "/home/fenicu/test_bot"
    APP_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    # Bot config
    BOT_TOKEN: $TEST_BOT_TOKEN
    SECRET_TOKEN: $TEST_SECRET_TOKEN
    WEBHOOK_URL: $TEST_WEBHOOK_URL
    WEBHOOK_PATH: $TEST_WEBHOOK_PATH
    PROXY_PORT: $TEST_PROXY_PORT
    WEBAPP_URL: $TEST_WEBAPP_URL
    # Database
    POSTGRES_USER: $TEST_POSTGRES_USER
    POSTGRES_PASSWORD: $TEST_POSTGRES_PASSWORD
    POSTGRES_PUB_PORT: $TEST_POSTGRES_PUB_PORT
    S3_ACCESS_KEY: $TEST_S3_ACCESS_KEY
    S3_SECRET_KEY: $TEST_S3_SECRET_KEY
    # Monitoring
    SENTRY_DSN: "http://a1bdead8-73ad-4aab-8fbe-91ad675519fc@10.10.40.40:8000/2"
    # Telegram OIDC
    TELEGRAM_OIDC_CLIENT_ID: $TEST_TELEGRAM_OIDC_CLIENT_ID
    TELEGRAM_OIDC_CLIENT_SECRET: $TEST_TELEGRAM_OIDC_CLIENT_SECRET
    TELEGRAM_OIDC_REDIRECT_URI: $TEST_TELEGRAM_OIDC_REDIRECT_URI
    SESSION_SECRET_KEY: $TEST_SESSION_SECRET_KEY
    # Common
    ROUTER_NAME: bot-test
    BOT_VERSION: $CI_COMMIT_SHORT_SHA

.env_prod:
  variables:
    ENVIRONMENT: production
    DEPLOY_PATH: "/home/fenicu/bot"
    APP_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    # Bot config
    BOT_TOKEN: $PROD_BOT_TOKEN
    SECRET_TOKEN: $PROD_SECRET_TOKEN
    WEBHOOK_URL: $PROD_WEBHOOK_URL
    WEBHOOK_PATH: $PROD_WEBHOOK_PATH
    PROXY_PORT: $PROD_PROXY_PORT
    WEBAPP_URL: $PROD_WEBAPP_URL
    # Short name Mini App из BotFather (t.me/FenicuTriggerBot/admin) -- публичное имя,
    # не секрет. На тестовом стенде не задаётся: у тестового бота своего Mini App нет,
    # там кнопка карточки чата ведёт на веб-версию.
    MINIAPP_SHORT_NAME: "admin"
    # Database
    POSTGRES_USER: $PROD_POSTGRES_USER
    POSTGRES_PASSWORD: $PROD_POSTGRES_PASSWORD
    POSTGRES_PUB_PORT: $PROD_POSTGRES_PUB_PORT
    S3_ACCESS_KEY: $PROD_S3_ACCESS_KEY
    S3_SECRET_KEY: $PROD_S3_SECRET_KEY
    # Monitoring
    SENTRY_DSN: "http://7b14130f-b764-4d1e-bb9e-f0a134e1b68f@10.10.40.40:8000/1"
    # Telegram OIDC
    TELEGRAM_OIDC_CLIENT_ID: $PROD_TELEGRAM_OIDC_CLIENT_ID
    TELEGRAM_OIDC_CLIENT_SECRET: $PROD_TELEGRAM_OIDC_CLIENT_SECRET
    TELEGRAM_OIDC_REDIRECT_URI: $PROD_TELEGRAM_OIDC_REDIRECT_URI
    SESSION_SECRET_KEY: $PROD_SESSION_SECRET_KEY
    # Common
    ROUTER_NAME: bot-prod
    BOT_VERSION: $CI_COMMIT_TAG

deploy:test:
  extends:
    - .deploy_template
    - .env_test
  rules:
    # Деплой только на push в master: protected CI/CD variables (BOT_TOKEN,
    # MODERATION_CHANNEL_ID, TELEGRAM_BOT_API_URL и т.д.) недоступны на
    # MR-pipeline, поскольку feature-branch не protected -- generate-env.sh
    # с set -u падает на первой же unbound. Мерж в master автоматом запустит
    # этот job в защищённом контексте.
    - if: $CI_COMMIT_BRANCH == "master"
  needs:
    - job: build:test
      optional: false
  environment:
    name: test
    url: $TEST_WEBHOOK_URL

deploy:prod:
  extends:
    - .deploy_template
    - .env_prod
  rules:
    - if: $CI_COMMIT_TAG
      # when: manual
  needs:
    - job: build:prod
      optional: false
  environment:
    name: production
    url: $PROD_WEBHOOK_URL
  allow_failure: false

