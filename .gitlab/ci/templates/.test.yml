# =============================================================================
# Validate + test jobs
# =============================================================================
# DAG: lint/format/ftl + test:python — блокирующие гейты. test:* стартуют сразу
# (needs: []), параллельно с validate, и НЕ ждут фронтовые allow_failure джобы.
# build зависит точечно от этих гейтов (см. .build.yml).
# =============================================================================

# --- Переиспользуемые наборы правил ------------------------------------------
.rules_code: # бэкенд code-quality + тесты: MR, master, tag
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

.rules_frontend: # фронтовые проверки (advisory): MR, master
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# --- Базовые образы ----------------------------------------------------------
.python_base:
  image: ghcr.io/astral-sh/uv:python3.13-alpine
  tags: [docker]
  before_script:
    - uv sync --frozen --no-cache
  cache:
    key: python-${CI_COMMIT_REF_SLUG}
    paths:
      - .venv/

.node_base:
  image: node:20-alpine
  tags: [docker]
  before_script:
    - cd frontend
    - npm ci
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/

# --- validate (бэкенд, блокирующие) ------------------------------------------
lint:python:
  extends: [.python_base, .rules_code]
  stage: validate
  needs: []
  script:
    - echo "Running ruff check..."
    - uvx ruff check --config pyproject.toml ./app

format:python:
  extends: [.python_base, .rules_code]
  stage: validate
  needs: []
  script:
    - echo "Checking Python formatting..."
    - uvx ruff format --config pyproject.toml --check ./app

ftl-check:
  extends: [.python_base, .rules_code]
  stage: validate
  needs: []
  script:
    - echo "Running ftl check..."
    - uv run ftl check

# --- validate (фронтенд, advisory) -------------------------------------------
lint:frontend:
  extends: [.node_base, .rules_frontend]
  stage: validate
  needs: []
  script:
    - echo "Running ESLint..."
    - npm run lint
  allow_failure: true

typecheck:frontend:
  extends: [.node_base, .rules_frontend]
  stage: validate
  needs: []
  script:
    - echo "Running TypeScript type check..."
    - npx tsc --noEmit
  allow_failure: true

# --- test --------------------------------------------------------------------
test:python:
  extends: [.python_base, .rules_code]
  stage: test
  needs: [] # независим от validate — стартует параллельно
  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_DB: trigger_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    - name: valkey/valkey:8
      alias: valkey
  variables:
    TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/trigger_test"
    TEST_VALKEY_URL: "redis://valkey:6379/1"
  script:
    - echo "Running Python tests..."
    - uv run pytest
        --cov=app
        --cov-report=xml:coverage.xml
        --cov-report=term-missing
        --cov-fail-under=65
        -v --tb=short
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

test:frontend:
  extends: [.node_base, .rules_frontend]
  stage: test
  needs: []
  script:
    - echo "Running frontend tests..."
    - |
      if npm run test --if-present 2>/dev/null; then
        echo "Tests completed"
      else
        echo "No test script found, skipping..."
      fi
  allow_failure: true
