services:
  inference:
    image: ${INFERENCE_IMAGE}
    restart: unless-stopped
    ports:
      - "${INFERENCE_PORT:-8100}:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-vl:7b}
      NSFW_THRESHOLD: ${NSFW_THRESHOLD:-0.85}
      API_KEY: ${INFERENCE_API_KEY}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      options:
        max-size: "10m"
    networks:
      - inference_network

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
    networks:
      - inference_network

volumes:
  ollama_data:

networks:
  inference_network:
    driver: bridge
