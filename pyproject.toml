[project]
name = "trigger"
version = "0.1.0"
description = "Trigger Bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.30.0",
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.128.0",
    "pydantic-settings>=2.12.0",
    "redis>=7.1.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "uvicorn>=0.40.0",
    "fluentogram[cli]>=1.2.1",
    "pyyaml>=6.0.3",
    "faststream[rabbit]>=0.6.4",
    "pillow>=12.1.0",
    "alembic-postgresql-enum>=1.8.0",
    "aiotracemoeapi>=3.1.1",
    "jinja2>=3.1.6",
    "apscheduler>=3.11.2",
    "aioboto3>=13.0.0",
    "aiofiles>=24.1.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "authlib>=1.4.0",
    "itsdangerous>=2.2.0",
]

[tool.ruff]
src = ["app"]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".ruff_cache",
    "__pypackages__",
    "__pycache__",
    "*.pyi",
    "venv",
    ".venv",
    "app/db/migrations/versions",
    "generated",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "ERA",    # eradicate
    "PL",     # pylint
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "FA",     # flake8-future-annotations
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D203", "D205", "D212", "D213", "D215", "D400", "D401", "D404",
    "D405", "D406", "D407", "D408", "D409", "D410", "D411", "D413",
    "D414", "D416", "D417",

    "E402",

    "ARG001", "ARG002",

    "C901",     # complex-structure
    "PLR0911",  # too-many-arguments
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR5501",  # collapsible-else-if
    "PLR2004",  # magic-value-comparison

    "ANN002", "ANN003", "ANN401",
    "B008",

    "BLE001", # blind-except
    "FBT001", "FBT002", # boolean-trap
    "COM812", # trailing-comma-missing (конфликтует с formatter)
    "ISC001", # single-line-implicit-string-concatenation (конфликтует с formatter)
    "RUF001", "RUF002", "RUF003", # ambiguous unicode
    "S101",   # assert (нужен для pytest)
    "TRY301", # abstract-raise
    "UP006",  # non-pep585-annotation (для совместимости с Pydantic)
    "UP007",  # non-pep604-annotation (для совместимости с Pydantic)
]

[dependency-groups]
dev = [
    "ftl-extract>=0.12.0a1",
    "ruff>=0.15.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --tb=short"

[tool.coverage.run]
omit = [
    "app/main.py",
    "app/bot/dispatcher.py",
    "app/core/logging.py",
    "app/core/tasks.py",
    "app/db/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
prerelease = "allow"

[[tool.uv.index]]
url = "http://10.10.40.8:3141/root/pypi/+simple/"
default = true

[tool.ftl-extract.extract]
code-path = "app"
locales-path = "locales"
languages = ["ru", "en"]
i18n-keys-append = ["loc_i18n", "new_i18n"]
default-ftl-file = "messages.ftl"
comment-keys-mode = "comment"

[tool.ftl-extract.check]
locales-path = "locales"
code-path = "app"
languages = ["ru", "en"]
i18n-keys-append = ["loc_i18n", "new_i18n"]
default-ftl-file = "messages.ftl"
checks = ["all"]
suggest-from = ["en"]
fail-on = ["error"]
report-format = "terminal"
